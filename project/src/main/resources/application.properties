spring.application.name=pitccexercise

# add datasource properties
spring.datasource.url=jdbc:postgresql://localhost:5432/pitcc_db
spring.datasource.username=pedro
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# jsp mvc config
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# enable flyway debuging / ensure fields
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
